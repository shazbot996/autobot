# autobot configuration. This file is the only place configuration lives; the
# terminal user interface (`make launch`) is a front for it, not a second store.
# Loaded and validated by src/autobot/config.py. Set AUTOBOT_CONFIG to load a
# different file.

[host]
# Hostname of the Intel NUC. `make audio-check` refuses to run on any other
# host, and when this is empty.
nuc_hostname = "branch"

[audio]
# A device is a case-insensitive substring of a name in the `make audio-check`
# device list (an exact name wins over a substring), or a numeric index.
# Prefer names: indexes move when hardware is plugged in.
#
# "pipewire" is the ALSA device that PipeWire provides. It follows PipeWire's
# default source and sink, which on the NUC are:
#   source: AIRHUG 21 (USB microphone, ALSA card 1; it has no playback side)
#   sink:   Built-in Audio Analog Stereo (HDA Intel PCH ALC256, ALSA card 0)
# Change them with `wpctl status` and `wpctl set-default <id>`.
#
# The raw hardware devices ("AIRHUG 21: USB Audio (hw:1,0)" and
# "HDA Intel PCH: ALC256 Analog (hw:0,0)") do not work here: they reject
# 16 kHz ("Invalid sample rate"; the AIRHUG captures at 48 kHz only) and
# PipeWire holds them open. PipeWire resamples to 16 kHz for us.
input_device = "pipewire"
output_device = "pipewire"
sample_rate = 16000
frame_ms = 80

[[wake_phrases]]
phrase = "autobot"
# kind is the detector that implements the phrase:
#   "openwakeword"  a model trained for the phrase scores the audio. Cheap
#                   enough to run all day. Needs `model`.
#   "text_match"    the local transcript contains the phrase. The fallback: it
#                   needs no trained model, but transcribes all speech it hears.
#   "sherpa_kws"    sherpa-onnx's keyword spotter listens for the phrase as it
#                   is spelled. It needs no training: the baseline the trained
#                   model is measured against. It ignores `model`.
# A fresh install starts on "text_match": no trained model is installed yet.
kind = "text_match"
# Path of the model file, relative to the repository root. Required for
# "openwakeword", unused by "text_match" and "sherpa_kws". The studio
# (`make launch`) installs the trained model: it writes kind, model and
# threshold here when the owner confirms a candidate, with the model's
# evaluation beside it (autobot.json).
model = ""
# Score from 0 to 1 at which the detector fires. Higher means fewer false
# accepts and more misses; autobot.json lists both for a sweep of thresholds
# and recommends one. For "text_match" use 0.5. For "sherpa_kws" 0.5 is
# sherpa-onnx's own default, and the value does little until it is high.
threshold = 0.5
target = "ack"

# Agent routing. The wake phrase only wakes autobot; the face then listens
# for a command and hands it to an agent. A rule matches when its command
# stands anywhere in what is said, among other words ("autobot, echo that
# back" runs the echo). Rules are tried in this order, and the first that
# matches wins. A command is heard only through a "text_match" wake phrase's
# transcripts. The agents: "echo", "question", "weather", "time", "camera"
# and "introduce", each defined by an [[agents]] table below. A rule may carry
# a `mode`, a word the agent receives with the command: two rules to one agent
# are aliases, and the mode is what differs ("forecast" opens the weather
# agent on the days ahead). A rule may also carry `examples`, phrases that
# mean what its command means, for the semantic match that is tried when no
# command stands in what was said. The Agent routing screen edits these.
[[routes]]
command = "question"
agent = "question"

[[routes]]
command = "weather"
agent = "weather"

[[routes]]
command = "forecast"
agent = "weather"
mode = "forecast"

[[routes]]
command = "time"
agent = "time"

[[routes]]
command = "camera"
agent = "camera"

[[routes]]
command = "cameras"
agent = "camera"

[[routes]]
command = "introduce"
agent = "introduce"

[[routes]]
command = "echo"
agent = "echo"

# The shared word lists. Any word of `yes` answers a confirmation yes and any
# word of `no` answers it no; a word that is in neither counts for nothing.
# `actions` are the global action keywords, heard at every step of a session
# before the rules: "cancel" leaves whatever runs and goes back one level of
# the tree. A word stands in one list only. The Word lists screen edits these.
[words]
yes = ["yes", "yeah", "yep", "yup", "sure", "okay", "ok", "affirmative", "go ahead", "you bet", "you betcha", "do it", "absolutely", "please do"]
no = ["no", "nope", "nah", "no way", "negative", "stop", "don't", "never mind"]
actions = ["cancel"]

# The agents' definitions, one [[agents]] table each. A definition is data:
# the agent's code is not in it. Every agent has a `name`, a `description`,
# a `prompt` (the words wrapped around the owner's for an agent that calls a
# language model; the introduce agent's written script), two confirmations,
# each on or off with its question (`confirm_entry` after the command matches,
# `confirm_request` before a request goes off the machine), and `listening`,
# whether the face listens, and hears "cancel", while the agent runs. An
# agent may also have a `model` ("none", the default, "local" or "gemini"), a
# `fallback` (the models to try in order when its own cannot answer, and, last
# only, a line it says instead), `[[agents.parameters]]` (named slots, each
# with a `type` of "string", "integer", "number" or "boolean", its allowed
# `values` and whether it is `required`) and `[[agents.tools]]` (each with a
# `name`, a `description` and `parameters` of the same shape). The weather and
# camera agents also have settings of their own. The Agent editor screen edits
# these.
[[agents]]
name = "echo"
description = "Records five seconds of your voice and plays it back."
confirm_entry = false
confirm_entry_question = "Are you sure you want to start this?"
confirm_request = false
confirm_request_question = "This may cost a few dollars. Are you sure you want to run this?"
listening = true

[[agents]]
name = "question"
description = "Asks a language model your question and answers with a spoken summary and the details on the screen."
# The prompt asks for the two parts of the answer: the summary read aloud and
# the detail shown on the screen, as one JSON object the agent takes apart.
prompt = """
You are autobot, a voice assistant on the owner's computer at home. The owner
asks you a question out loud, and you answer it in two parts.
The summary is read aloud: one to three short sentences in plain words, easy
to hear, with no lists, symbols or markup.
The detail is shown on a small text screen: a few short lines of plain text,
at most forty characters each, with the facts the summary leaves out.
Reply with one JSON object and nothing else, in this shape:
{"summary": "...", "detail": ["...", "..."]}
"""
confirm_entry = false
confirm_entry_question = "Are you sure you want to start this?"
confirm_request = false
confirm_request_question = "This may cost a few dollars. Are you sure you want to run this?"
listening = true
# The model behind the agent: "none" (code only), "local" (the inference
# server's language model, on GAMEON1) or "gemini" (as the service account).
model = "gemini"

[[agents]]
name = "weather"
description = "Says today's weather for your zip code; the forecast command gives the days ahead."
confirm_entry = false
confirm_entry_question = "Are you sure you want to start this?"
confirm_request = false
confirm_request_question = "This may cost a few dollars. Are you sure you want to run this?"
listening = true
# The location: a five-digit zip code. Empty until it is set; the agent
# refuses to look anything up without one.
zip_code = "43214"
# The agent's own cap on its lookups: the first line; the caps on the Weather
# API in [[gcp.quotas]] are the backstop (GC-10).
daily_limit = 100
minute_limit = 10
# The Secret Manager secret that holds the Weather API key. Only the name is
# configuration: the key is never written to this file (GC-9).
secret = "autobot-weather-api-key"

[[agents]]
name = "time"
description = "Says the time from this computer's clock."
confirm_entry = false
confirm_entry_question = "Are you sure you want to start this?"
confirm_request = false
confirm_request_question = "This may cost a few dollars. Are you sure you want to run this?"
listening = true

[[agents]]
name = "camera"
description = "Opens the camera application, with the four outside cameras, in Firefox on the NUC."
confirm_entry = true
confirm_entry_question = "Are you sure you want to start this?"
confirm_request = false
confirm_request_question = "This may cost a few dollars. Are you sure you want to run this?"
listening = true
# The folder the commands run in, relative to the repository root: the
# owner's copy of the camera application's project.
folder = "assistant"
# The local commands, one a line, started in order without waiting for any to
# end: the proxy server, then Firefox. NUC only.
commands = """
make fourway-server
make fourway
"""

[[agents]]
name = "introduce"
description = "autobot introduces himself and says how he works."
# The script, read aloud as it stands, the same every time.
prompt = """
Hi, I'm autobot, a voice assistant that lives on this computer.
Say my name, then a command, and I hand it to one of my agents.
I listen and speak right here, so your voice never leaves the house.
When you ask me a question, only the words I heard go out to a language model.
Say cancel at any time to go back a step.
"""
confirm_entry = false
confirm_entry_question = "Are you sure you want to start this?"
confirm_request = false
confirm_request_question = "This may cost a few dollars. Are you sure you want to run this?"
listening = true

# The core agent is autobot himself: it takes what was said when no rule
# matches, so it has no [[routes]] entry. Its prompt is its personality.
[[agents]]
name = "core"
description = "autobot himself: talks with you when no command matches, on the inference server's language model."
prompt = """
You are autobot, a friendly voice assistant on the owner's computer at home.
You talk with the owner out loud, one turn at a time, and remember what was
said earlier in the conversation.
Keep each reply short and plain: one to three sentences that are easy to
hear, with no lists, symbols or markup.
When a question needs more knowledge or reasoning than you have, hand it to
one of the agents you are given, with the question that agent should get.
"""
confirm_entry = false
confirm_entry_question = "Are you sure you want to start this?"
confirm_request = false
confirm_request_question = "This may cost a few dollars. Are you sure you want to run this?"
listening = true
model = "local"
# When the server is away: Gemini, then this line, said aloud.
fallback = ["gemini", "the server is away"]

[ack]
text = "Yes?"
# A piper-tts voice name. Synthesis is local (CONSTRAINTS.md CN-2).
voice = "en_US-joe-medium"

[tui]
# The colour theme of the terminal user interface: "light", "dark" or "sun".
# Pressing T in the interface switches to the next one and writes it here.
theme = "sun"

# The GPU inference server on GAMEON1, in WSL, on the owner's LAN. The NUC
# never depends on it: while it is away, each job falls back on its own. The
# NUC reads the address, the token file, the timeouts, the poll intervals and
# the thresholds; the server reads its hostname and its models from here.
[server]
# Whether the NUC looks for the server at all.
enabled = true
# Whether what is said inside a session (a command, a question, a yes or a
# no) is sent to the server to be transcribed by its larger model. Off: every
# transcript is the NUC's own tiny.en. Turn it on only once CONSTRAINTS.md
# CN-1 has been amended to allow speech-to-text on GAMEON1; the wake word is
# never sent either way.
stt_enabled = false
# The server's address, by its DHCP reservation, as http://host:port. The
# port is the one the server binds and the firewall rules open.
url = "http://192.168.86.53:8300"
# The shared bearer token, relative to the repository root. Only the path is
# configuration: the file is a secret, made by `make server-token` at mode
# 0600, and never read by anything but the client.
token_file = "secrets/server-token"
# The hostname the server refuses to run anywhere but.
hostname = "GAMEON1"
# The timeout of each call, in seconds. On a timeout the NUC falls back at
# once and does not retry. Speech-to-text gets the base plus so much per
# second of audio; chat gets one limit to its first token and one in all.
health_timeout = 1.0
stt_timeout_base = 0.5
stt_timeout_per_second = 0.25
route_timeout = 1.5
chat_first_token_timeout = 3.0
chat_timeout = 30.0
# How often the NUC asks the server's /health, in seconds: while it is up,
# and, while it is down, backing off from the least to the most.
poll_up_seconds = 5.0
poll_down_min_seconds = 5.0
poll_down_max_seconds = 60.0
# The confidence, above 0 and at most 1, at which the routing cascade admits
# tier 2 (the semantic match on the NUC) and tier 3 (the server's model).
# Tier 1, the keyword rules, always counts as 1.
tier2_threshold = 0.6
tier3_threshold = 0.7
# The most characters of hints (agent names, commands, modes, yes and no
# words, action keywords) sent with each transcription.
hint_chars = 500
# The most rounds of tool calls the NUC runs in one turn.
tool_rounds = 3
# How long, in seconds, the core agent waits for the next turn after it has
# answered, before the session ends.
core_listen_seconds = 10
# The server's own models, read on GAMEON1. The speech-to-text model is a
# directory relative to the server's checkout, fetched there by
# `make server-fetch-models`; its compute type is "int8_float16" or "float16".
stt_model = "models/faster-whisper/large-v3-turbo"
stt_compute_type = "int8_float16"
# The language model, as the runtime names it. Empty until `make server-eval`
# has measured the candidates and the owner has written the winner here.
llm_model = ""
# The language model's context, in tokens.
llm_context = 8192
# The runtime that serves the language model, bound to loopback on GAMEON1.
runtime = "ollama"
runtime_url = "http://127.0.0.1:11434"
# The NUC's embedding model for tier 2: the int8 ONNX file of
# all-MiniLM-L6-v2, relative to the repository root, with its tokenizer.json
# beside it. Fetched by `make fetch-models`; loaded from this path only.
embedding_model = "models/embedding/all-MiniLM-L6-v2/model_int8.onnx"

# Google Cloud. autobot and its agents use Google Cloud only as their own
# service account, never as the owner (GC-4). The Google Cloud screen
# (`make launch`) checks each step of the setup and shows the gcloud commands
# that fix what is missing; the owner runs them himself, and autobot never
# does. The screen writes `project` and `region`; the rest is edited here.
[gcp]
# The Google Cloud project, in the organization cambiumplatform.com.
project = "schiele-autobot-dev"
# The region Vertex AI is called in, and regional quotas are compared in.
region = "us-east5"
# The dedicated service account. It gets the narrowest roles that cover what
# autobot does, and never a role that could configure the project (GC-6).
service_account = "autobot-agent@schiele-autobot-dev.iam.gserviceaccount.com"
# The service account's key, relative to the repository root. Only this path
# is configuration. The file is a credential: it is created by the script the
# Key step shows, it is git-ignored (`secrets/`), and nothing reads it but
# Google's own sign-in code (GC-7).
credentials_file = "secrets/service-account-autobot-agent.json"
# The Gemini API the question agent calls: "aiplatform.googleapis.com"
# (Vertex AI, as the service account) or "generativelanguage.googleapis.com"
# (the Gemini Developer API, with an API key kept as a secret) (GC-11).
gemini_api = "aiplatform.googleapis.com"
# The Gemini model the question agent calls. The Gemini step lists the
# models the API offers now and writes the one chosen here. A cap on a quota
# that is counted per model is for this model.
gemini_model = "gemini-3.5-flash-lite"
# Where Vertex AI serves the model: "global", or a region such as "us-east5".
# The newer Gemini models are served only at "global", and asking for one in
# a region that does not serve it answers 404 NOT_FOUND. Quotas are still
# compared in `region`.
gemini_location = "global"
# The Cloud Storage buckets autobot is meant to use. None yet (GC-12).
buckets = []

# The intended cap on each billed API (GC-10). `metric` is the quota id that
#   gcloud beta quotas info list --service=<api> --project=<project>
# prints; the cap's period (a day, a minute) is part of the id. `limit` is the
# most the live quota may be. An id that does not exist shows as missing on
# the Rate limits step, with that command beside it.
#
# The Weather API has no quota for the API as a whole: each of its seven
# endpoints has its own per-day and per-minute quota (listed from the project
# on 2026-11-27). Every endpoint is capped, the ones no agent calls too, so
# that a leaked key is capped whatever it asks for: 100 a day and 10 a minute
# each.
[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "CurrentConditionsQueriesPerDay"
limit = 100

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "CurrentConditionsQueriesPerMinute"
limit = 10

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "ForecastDaysQueriesPerDay"
limit = 100

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "ForecastDaysQueriesPerMinute"
limit = 10

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "ForecastHoursQueriesPerDay"
limit = 100

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "ForecastHoursQueriesPerMinute"
limit = 10

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "ForecastMinutesQueriesPerDay"
limit = 100

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "ForecastMinutesQueriesPerMinute"
limit = 10

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "HistoryHoursQueriesPerDay"
limit = 100

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "HistoryHoursQueriesPerMinute"
limit = 10

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "MapTileQueriesPerDay"
limit = 100

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "MapTileQueriesPerMinute"
limit = 10

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "PublicAlertsQueriesPerDay"
limit = 100

[[gcp.quotas]]
api = "weather.googleapis.com"
metric = "PublicAlertsQueriesPerMinute"
limit = 10

# Gemini on Vertex AI has no cap here for now (the owner's decision,
# 2026-11-27). Its request quota is counted per model and per region, and
# Google's own limit for the chosen model in us-east5 is already below the 10
# a minute that was intended: asking for 10 was refused as an increase. The
# Rate limits step notes that the API is billed and uncapped. To cap it later,
# add an entry such as:
#   [[gcp.quotas]]
#   api = "aiplatform.googleapis.com"
#   metric = "GenerateContentRequestsPerMinutePerProjectPerRegionPerBaseModel"
#   limit = 10
# It is for the model in `gemini_model` unless it names its own `base_model`.
